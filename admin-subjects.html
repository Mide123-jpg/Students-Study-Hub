<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects - Student Study Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <div class="sidebar-overlay" id="adminOverlay"></div>
    <aside class="sidebar" id="adminSidebar"></aside>

    <div class="main">
        <header class="topbar">
            <h1>Manage Subjects</h1>
            <div class="topbar-right">
                <span class="admin-badge"><i class="fas fa-shield-halved"></i> Admin</span>
                <span id="adminName"></span>
                <button class="btn-logout" onclick="SSH.logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>
        <div class="content">
            <div class="form-card">
                <h2 id="formTitle">Add Subject</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fName">Subject Name</label>
                        <input type="text" id="fName" placeholder="e.g. Mathematics">
                    </div>
                    <div class="form-group">
                        <label for="fIcon">Font Awesome Icon Class</label>
                        <input type="text" id="fIcon" placeholder="e.g. fa-calculator">
                    </div>
                    <div class="form-group full">
                        <label for="fDesc">Description</label>
                        <textarea id="fDesc" placeholder="Short description of the subject"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" id="btnSave" onclick="saveSubject()">Add Subject</button>
                    <button class="btn btn-cancel" id="btnCancel" onclick="cancelEdit()" style="display:none">Cancel</button>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search subjects..." oninput="renderTable()">
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Description</th><th>Icon</th><th>Actions</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin.js"></script>
    <script>
    (function () {
        if (!SSH.initAdmin()) return;
        var editId = null;

        window.saveSubject = function () {
            var name = document.getElementById("fName").value.trim();
            var desc = document.getElementById("fDesc").value.trim();
            var icon = document.getElementById("fIcon").value.trim();
            if (!name) { alert("Please enter a subject name."); return; }
            if (editId) {
                SSH.updateSubject(editId, { name:name, description:desc, icon:icon||"fa-book" });
                editId = null;
                document.getElementById("formTitle").textContent = "Add Subject";
                document.getElementById("btnSave").textContent = "Add Subject";
                document.getElementById("btnCancel").style.display = "none";
            } else {
                SSH.addSubject({ name:name, description:desc, icon:icon||"fa-book" });
            }
            clearForm();
            renderTable();
        };

        window.editSubject = function (id) {
            var s = SSH.getSubjectById(id);
            if (!s) return;
            document.getElementById("fName").value = s.name;
            document.getElementById("fDesc").value = s.description;
            document.getElementById("fIcon").value = s.icon;
            editId = id;
            document.getElementById("formTitle").textContent = "Edit Subject";
            document.getElementById("btnSave").textContent = "Update Subject";
            document.getElementById("btnCancel").style.display = "inline-block";
            window.scrollTo({ top:0, behavior:"smooth" });
        };

        window.deleteSubject = function (id) {
            if (!confirm("Delete this subject?")) return;
            SSH.deleteSubject(id);
            if (editId === id) cancelEdit();
            renderTable();
        };

        window.cancelEdit = function () {
            editId = null;
            document.getElementById("formTitle").textContent = "Add Subject";
            document.getElementById("btnSave").textContent = "Add Subject";
            document.getElementById("btnCancel").style.display = "none";
            clearForm();
        };

        function clearForm() {
            document.getElementById("fName").value = "";
            document.getElementById("fDesc").value = "";
            document.getElementById("fIcon").value = "";
        }

        window.renderTable = function () {
            var q = (document.getElementById("searchInput").value || "").toLowerCase();
            var all = SSH.getAllSubjects();
            var filtered = all.filter(function (s) {
                return !q || s.name.toLowerCase().indexOf(q) !== -1 || s.description.toLowerCase().indexOf(q) !== -1;
            });
            var tbody = document.getElementById("tableBody");
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">No subjects found.</td></tr>';
                return;
            }
            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var s = filtered[i];
                html += '<tr><td><strong>' + SSH.esc(s.name) + '</strong></td>' +
                    '<td>' + SSH.esc(s.description) + '</td>' +
                    '<td><i class="fas ' + SSH.escAttr(s.icon) + '"></i> ' + SSH.esc(s.icon) + '</td>' +
                    '<td class="actions">' +
                        '<button class="btn btn-primary btn-sm" onclick="editSubject(\'' + s.id + '\')"><i class="fas fa-pen"></i></button>' +
                        '<button class="btn btn-danger btn-sm" onclick="deleteSubject(\'' + s.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</td></tr>';
            }
            tbody.innerHTML = html;
        };

        renderTable();
    })();
    </script>
</body>
</html>
