<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Student Study Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <div class="sidebar-overlay" id="adminOverlay"></div>
    <aside class="sidebar" id="adminSidebar"></aside>

    <div class="main">
        <header class="topbar">
            <h1>Manage Students</h1>
            <div class="topbar-right">
                <span class="admin-badge"><i class="fas fa-shield-halved"></i> Admin</span>
                <span id="adminName"></span>
                <button class="btn-logout" onclick="SSH.logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>
        <div class="content">
            <div class="stats-grid" id="statsGrid" style="margin-bottom:1.5rem;"></div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="renderTable()">
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Level</th><th>Quiz Attempts</th><th>Actions</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="form-card" id="detailCard" style="display:none;margin-top:1.5rem;">
                <h2 id="detailTitle">Student Details</h2>
                <div id="detailBody"></div>
                <div class="form-actions" style="margin-top:1rem;">
                    <button class="btn btn-danger" id="btnDeleteStudent" onclick="deleteSelectedStudent()"><i class="fas fa-trash"></i> Remove Student</button>
                    <button class="btn btn-cancel" onclick="hideDetail()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin.js"></script>
    <script>
    (function () {
        if (!SSH.initAdmin()) return;
        var selectedUserId = null;

        function getAttempts(userId) {
            var raw = _get(SSH.KEYS.ATTEMPT_DB) || {};
            return raw[userId] || [];
        }

        function renderStats() {
            var students = SSH.getAllStudentUsers();
            var totalAttempts = 0;
            var avgScore = 0;
            var count = 0;
            for (var i = 0; i < students.length; i++) {
                var atts = getAttempts(students[i].id);
                totalAttempts += atts.length;
                for (var j = 0; j < atts.length; j++) {
                    avgScore += atts[j].pct;
                    count++;
                }
            }
            avgScore = count ? Math.round(avgScore / count) : 0;
            var html =
                '<div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>' + students.length + '</h3><p>Total Students</p></div></div>' +
                '<div class="stat-card"><div class="stat-icon green"><i class="fas fa-pen-to-square"></i></div><div class="stat-info"><h3>' + totalAttempts + '</h3><p>Total Quiz Attempts</p></div></div>' +
                '<div class="stat-card"><div class="stat-icon yellow"><i class="fas fa-chart-simple"></i></div><div class="stat-info"><h3>' + avgScore + '%</h3><p>Average Score</p></div></div>';
            document.getElementById("statsGrid").innerHTML = html;
        }

        window.renderTable = function () {
            var q = (document.getElementById("searchInput").value || "").toLowerCase();
            var students = SSH.getAllStudentUsers();
            var filtered = students.filter(function (u) {
                return !q || u.fullName.toLowerCase().indexOf(q) !== -1 || u.email.toLowerCase().indexOf(q) !== -1;
            });
            var tbody = document.getElementById("tableBody");
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">No students found.</td></tr>';
                return;
            }
            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var u = filtered[i];
                var atts = getAttempts(u.id);
                var lastScore = atts.length ? atts[atts.length - 1].pct + "%" : "-";
                html += '<tr style="cursor:pointer" onclick="showDetail(' + u.id + ')">' +
                    '<td>#' + u.id + '</td>' +
                    '<td><strong>' + SSH.esc(u.fullName) + '</strong></td>' +
                    '<td>' + SSH.esc(u.email) + '</td>' +
                    '<td>' + SSH.esc(u.level) + '</td>' +
                    '<td><span class="badge badge-blue">' + atts.length + ' attempts</span></td>' +
                    '<td><button class="btn btn-primary btn-sm"><i class="fas fa-eye"></i> View</button></td></tr>';
            }
            tbody.innerHTML = html;
        };

        window.showDetail = function (userId) {
            var users = SSH.getUsers();
            var user = null;
            for (var i = 0; i < users.length; i++) {
                if (users[i].id === userId) { user = users[i]; break; }
            }
            if (!user) return;
            selectedUserId = userId;

            document.getElementById("detailTitle").textContent = user.fullName + " — Details";
            var atts = getAttempts(userId);
            var saved = SSH.getSavedMaterials(userId);
            var timetable = SSH.getSessions(userId);

            var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">' +
                '<div><strong>Email:</strong> ' + SSH.esc(user.email) + '</div>' +
                '<div><strong>Level:</strong> ' + SSH.esc(user.level) + '</div>' +
                '<div><strong>Saved Materials:</strong> ' + saved.length + '</div>' +
                '<div><strong>Timetable Entries:</strong> ' + timetable.length + '</div>' +
                '</div>';

            if (atts.length) {
                html += '<h3 style="font-size:0.95rem;margin-bottom:0.5rem;">Quiz History</h3>';
                html += '<table class="data-table" style="margin-bottom:0"><thead><tr><th>Quiz</th><th>Score</th><th>Date</th></tr></thead><tbody>';
                for (var j = atts.length - 1; j >= 0 && j >= atts.length - 10; j--) {
                    var a = atts[j];
                    var quiz = SSH.getQuizById(a.quizId);
                    var qTitle = quiz ? quiz.title : a.quizId;
                    var dateStr = new Date(a.completedAt).toLocaleDateString();
                    var scoreClass = a.pct >= 70 ? "badge-green" : a.pct >= 50 ? "badge-yellow" : "badge-red";
                    html += '<tr><td>' + SSH.esc(qTitle) + '</td><td><span class="badge ' + scoreClass + '">' + a.pct + '% (' + a.correct + '/' + a.total + ')</span></td><td>' + dateStr + '</td></tr>';
                }
                html += '</tbody></table>';
            } else {
                html += '<p class="empty-msg">No quiz attempts yet.</p>';
            }

            document.getElementById("detailBody").innerHTML = html;
            document.getElementById("detailCard").style.display = "block";
            window.scrollTo({ top: document.getElementById("detailCard").offsetTop - 80, behavior:"smooth" });
        };

        window.hideDetail = function () {
            document.getElementById("detailCard").style.display = "none";
            selectedUserId = null;
        };

        window.deleteSelectedStudent = function () {
            if (!selectedUserId) return;
            if (!confirm("Remove this student? This cannot be undone.")) return;
            var users = SSH.getUsers();
            var updated = [];
            for (var i = 0; i < users.length; i++) {
                if (users[i].id !== selectedUserId) {
                    updated.push(users[i]);
                }
            }
            SSH.saveUsers(updated);
            hideDetail();
            renderStats();
            renderTable();
        };

        renderStats();
        renderTable();
    })();
    </script>
</body>
</html>
