<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Past Questions - Student Study Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <div class="sidebar-overlay" id="adminOverlay"></div>
    <aside class="sidebar" id="adminSidebar"></aside>

    <div class="main">
        <header class="topbar">
            <h1>Manage Past Questions</h1>
            <div class="topbar-right">
                <span class="admin-badge"><i class="fas fa-shield-halved"></i> Admin</span>
                <span id="adminName"></span>
                <button class="btn-logout" onclick="SSH.logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>
        <div class="content">
            <div class="form-card">
                <h2 id="formTitle">Add Past Question</h2>
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="fTitle">Title</label>
                        <input type="text" id="fTitle" placeholder="e.g. Mathematics WAEC 2024">
                    </div>
                    <div class="form-group">
                        <label for="fSubject">Subject</label>
                        <select id="fSubject"></select>
                    </div>
                    <div class="form-group">
                        <label for="fCourse">Course / Area</label>
                        <input type="text" id="fCourse" placeholder="e.g. Algebra & Calculus">
                    </div>
                    <div class="form-group">
                        <label for="fSession">Session / Year</label>
                        <input type="text" id="fSession" placeholder="e.g. 2024">
                    </div>
                    <div class="form-group">
                        <label for="fExam">Exam Type</label>
                        <select id="fExam">
                            <option value="WAEC">WAEC</option>
                            <option value="NECO">NECO</option>
                            <option value="JAMB">JAMB</option>
                            <option value="School Exam">School Exam</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fLevel">Level</label>
                        <select id="fLevel">
                            <option value="SS1">SS1</option>
                            <option value="SS2">SS2</option>
                            <option value="SS3">SS3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fCount">Question Count</label>
                        <input type="number" id="fCount" min="1" placeholder="e.g. 40">
                    </div>
                    <div class="form-group full">
                        <label for="fDesc">Description</label>
                        <textarea id="fDesc" placeholder="Brief description of the paper"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" id="btnSave" onclick="savePQ()">Add Past Question</button>
                    <button class="btn btn-cancel" id="btnCancel" onclick="cancelEdit()" style="display:none">Cancel</button>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search past questions..." oninput="renderTable()">
                <select id="filterSubject" onchange="renderTable()"><option value="">All Subjects</option></select>
                <select id="filterExam" onchange="renderTable()">
                    <option value="">All Exams</option>
                    <option value="WAEC">WAEC</option>
                    <option value="NECO">NECO</option>
                    <option value="JAMB">JAMB</option>
                    <option value="School Exam">School Exam</option>
                </select>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead><tr><th>Title</th><th>Subject</th><th>Exam</th><th>Session</th><th>Level</th><th>Q's</th><th>Actions</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin.js"></script>
    <script>
    (function () {
        if (!SSH.initAdmin()) return;
        var editId = null;

        document.getElementById("fSubject").innerHTML = SSH.getSubjectOptions();
        document.getElementById("filterSubject").innerHTML = '<option value="">All Subjects</option>' + SSH.getSubjectOptions();

        window.savePQ = function () {
            var title  = document.getElementById("fTitle").value.trim();
            var subject= document.getElementById("fSubject").value;
            var course = document.getElementById("fCourse").value.trim();
            var session= document.getElementById("fSession").value.trim();
            var exam   = document.getElementById("fExam").value;
            var level  = document.getElementById("fLevel").value;
            var count  = parseInt(document.getElementById("fCount").value) || 0;
            var desc   = document.getElementById("fDesc").value.trim();
            if (!title)  { alert("Please enter a title."); return; }
            if (!subject){ alert("Please select a subject."); return; }

            var data = { title:title, subject:subject, course:course, session:session, examType:exam, level:level, questionCount:count, description:desc };

            if (editId) {
                SSH.updatePastQuestion(editId, data);
                editId = null;
                document.getElementById("formTitle").textContent = "Add Past Question";
                document.getElementById("btnSave").textContent = "Add Past Question";
                document.getElementById("btnCancel").style.display = "none";
            } else {
                SSH.addPastQuestion(data);
            }
            clearForm();
            renderTable();
        };

        window.editPQ = function (id) {
            var p = SSH.getPastQuestionById(id);
            if (!p) return;
            document.getElementById("fTitle").value   = p.title;
            document.getElementById("fSubject").value = p.subject;
            document.getElementById("fCourse").value  = p.course;
            document.getElementById("fSession").value = p.session;
            document.getElementById("fExam").value    = p.examType;
            document.getElementById("fLevel").value   = p.level;
            document.getElementById("fCount").value   = p.questionCount;
            document.getElementById("fDesc").value    = p.description;
            editId = id;
            document.getElementById("formTitle").textContent = "Edit Past Question";
            document.getElementById("btnSave").textContent = "Update Past Question";
            document.getElementById("btnCancel").style.display = "inline-block";
            window.scrollTo({ top:0, behavior:"smooth" });
        };

        window.deletePQ = function (id) {
            if (!confirm("Delete this past question?")) return;
            SSH.deletePastQuestion(id);
            if (editId === id) cancelEdit();
            renderTable();
        };

        window.cancelEdit = function () {
            editId = null;
            document.getElementById("formTitle").textContent = "Add Past Question";
            document.getElementById("btnSave").textContent = "Add Past Question";
            document.getElementById("btnCancel").style.display = "none";
            clearForm();
        };

        function clearForm() {
            document.getElementById("fTitle").value = "";
            document.getElementById("fSubject").value = "";
            document.getElementById("fCourse").value = "";
            document.getElementById("fSession").value = "";
            document.getElementById("fCount").value = "";
            document.getElementById("fDesc").value = "";
        }

        window.renderTable = function () {
            var q   = (document.getElementById("searchInput").value || "").toLowerCase();
            var sub = document.getElementById("filterSubject").value;
            var ex  = document.getElementById("filterExam").value;
            var all = SSH.getAllPastQuestions();
            var filtered = all.filter(function (p) {
                var matchQ = !q || p.title.toLowerCase().indexOf(q) !== -1 || (p.course||"").toLowerCase().indexOf(q) !== -1;
                var matchS = !sub || p.subject === sub;
                var matchE = !ex  || p.examType === ex;
                return matchQ && matchS && matchE;
            });
            var tbody = document.getElementById("tableBody");
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">No past questions found.</td></tr>';
                return;
            }
            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var p = filtered[i];
                html += '<tr><td><strong>' + SSH.esc(p.title) + '</strong></td>' +
                    '<td>' + SSH.esc(p.subject) + '</td>' +
                    '<td><span class="badge badge-blue">' + SSH.esc(p.examType) + '</span></td>' +
                    '<td>' + SSH.esc(p.session) + '</td>' +
                    '<td>' + SSH.esc(p.level) + '</td>' +
                    '<td>' + p.questionCount + '</td>' +
                    '<td class="actions">' +
                        '<button class="btn btn-primary btn-sm" onclick="editPQ(\'' + p.id + '\')"><i class="fas fa-pen"></i></button>' +
                        '<button class="btn btn-danger btn-sm" onclick="deletePQ(\'' + p.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</td></tr>';
            }
            tbody.innerHTML = html;
        };

        renderTable();
    })();
    </script>
</body>
</html>
